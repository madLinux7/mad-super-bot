[package]
name = "mad-super-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "mad-super-bot"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3", features = ["sink"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
twitch_api = { version = "=0.8.0", default-features = false, features = ["helix", "eventsub", "reqwest"] }
twitch_oauth2 = { version = "0.17", features = ["reqwest"] }
zeroize = "1"
tempfile = "3"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_path_to_error = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices"] }
