name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: mad-super-bot
            asset: mad-super-bot-linux-amd64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mad-super-bot.exe
            asset: mad-super-bot.exe
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: mad-super-bot
            asset: mad-super-bot-darwin-amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: mad-super-bot
            asset: mad-super-bot-darwin-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag must match Cargo.toml version: v$VERSION" >&2
            exit 1
          fi

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable "${{ matrix.target }}"

      - name: Build release binary
        run: cargo +stable build --release --locked --bin mad-super-bot --target "${{ matrix.target }}"

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Include example settings
        run: cp config.example.yml dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
